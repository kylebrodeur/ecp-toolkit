[project]
name = "ecp-toolkit"
version = "0.1.0"
description = "The AI ECP control plane: one operator CLI for the whole family, mounting each kit's commands from its own manifest."
requires-python = ">=3.11"
dependencies = []  # stdlib only; git and uv are invoked as CLIs

[project.scripts]
ecp = "ecp_toolkit.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["ecp_toolkit"]

[tool.uv]
package = true